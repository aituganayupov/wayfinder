# Автообновление сайта на GitHub Pages.
# Каждые 5 минут собирает свежие данные (update_all.py --ci) и заново публикует сайт.
# Данные не попадают в историю проекта — они хранятся в кэше между запусками.
name: Обновление данных и публикация

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Данные прошлого запуска: медленные наборы (ставки, календарь, история за год)
      # не скачиваются заново каждые 5 минут
      - uses: actions/cache@v4
        with:
          path: data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      - name: Сбор свежих данных
        run: python update_all.py --ci
        env:
          TZ: Europe/Moscow

      - name: Подготовка сайта
        run: |
          mkdir _site
          cp index.html style.css *.js _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
